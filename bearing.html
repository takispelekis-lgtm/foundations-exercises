<style>
/* Layout: fixed sidebar of exercises on the left, one exercise at a time on the right.

:root {

  --soil: #d9b56b;
  --soil-2: #a67c3b;
  --clay: #b08968;
  --rock: #6b6b6b;
  --water: #4aa3df;
  --ok: #2e7d32;
  --warn: #d84315;
  --hl: #ffb300;
  --step-bg: #fff8e6;
  --font-ui: "Fira Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: "Fira Sans Condensed", "Fira Sans", "Segoe UI", sans-serif;
  --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(60,40,10,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1e2126; --panel-2: #262a30; --fg: #e8e6e1; --muted: #a39d92; --line: #3a3f47;
    --accent: #d99a4e; --accent-2: #6fb3dd; --load: #ff6b6b; --conc: #9a9a9a; --conc-2: #c9c9c9;
    --soil: #b08d4a; --soil-2: #7a5a2a; --clay: #8a6a4e; --rock: #4a4a4a; --water: #5fb2e8;
    --ok: #66bb6a; --warn: #ff8a65; --hl: #ffc947; --step-bg: #2a2820;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1e2126; --panel-2: #262a30; --fg: #e8e6e1; --muted: #a39d92; --line: #3a3f47;
  --accent: #d99a4e; --accent-2: #6fb3dd; --load: #ff6b6b; --conc: #9a9a9a; --conc-2: #c9c9c9;

}
* { box-sizing: border-box; }

/* ---------- university header (model: GeoFEM Web Solver) ---------- */
.uhead { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; margin: 10px 12px 0; padding: 10px 16px; background: #0f172a; color: #fff; border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.18); font-family: var(--font-ui); }
.uhead .ulogo { height: 46px; width: auto; background: #fff; padding: 5px 7px; border-radius: 7px; flex-shrink: 0; }

@media (max-width: 760px) { .uhead .udept { border-right: 0; padding-right: 0; } .uhead .uapp h1 { white-space: normal; } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 300px 1fr; min-height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow: auto; display: flex; flex-direction: column; }
.brand { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }

.nav button:hover { background: var(--panel-2); }

.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---------- exercise ---------- */

.ex-head .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.ex-head h2 { font-size: 28px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 16px; }
.statement { font-size: 16px; }
.statement ul, .statement ol { padding-left: 22px; margin: 6px 0; }
.statement li { margin: 2px 0; }
.given { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 14.5px; }
.given dt { color: var(--muted); }
.given dd { margin: 0; font-family: var(--font-math); font-size: 16px; text-align: right; }

/* figure */
.fig-wrap { position: relative; }
.fig { width: 100%; overflow: hidden; border-radius: 8px; background: var(--panel-2); }
.fig svg { display: block; width: 100%; height: auto; max-width: 100%; font-family: var(--font-ui); }

.fig .lbl-muted { fill: var(--muted); font-size: 11.5px; }
.fig .lbl-conc { fill: var(--conc-2); }
.fig .lbl-w { fill: #fff; font-weight: 600; }
.fig .conc { fill: var(--conc); stroke: var(--conc-2); stroke-width: 1.2; }

.fig .soil2 { fill: var(--soil-2); }
.fig .clay { fill: var(--clay); }
.fig .rock { fill: var(--rock); }
.fig .water { fill: var(--water); }
.fig .load { stroke: var(--load); fill: var(--load); }
.fig .load-line { stroke: var(--load); fill: none; stroke-width: 2; }
.fig .load-fill { fill: var(--load); fill-opacity: .14; stroke: var(--load); stroke-width: 1.5; }
.fig .weight { stroke: var(--accent-2); fill: var(--accent-2); }
.fig .weight-line { stroke: var(--accent-2); stroke-width: 3; fill: none; }
.fig .dimline { stroke: var(--fg); stroke-width: 1; fill: none; }
.fig .ground { stroke: var(--fg); stroke-width: 1.5; }
.fig .thin { stroke: var(--fg); stroke-width: 1; fill: none; }
.fig .dash { stroke-dasharray: 5 4; }
.fig .pt { fill: var(--load); stroke: #fff; stroke-width: 1.5; }
.fig .pile { fill: var(--conc); stroke: var(--conc-2); stroke-width: 1.2; }
.fig .ok { fill: var(--ok); } .fig .okl { stroke: var(--ok); }
.fig .warnf { fill: var(--warn); } .fig .warnl { stroke: var(--warn); }
.fig .hatch { fill: url(#hatch); }
.fig .blue { stroke: var(--accent-2); fill: none; stroke-width: 2.5; }
.fig .fill-blue { fill: var(--accent-2); fill-opacity: .22; stroke: var(--accent-2); stroke-width: 2; }
.fig .fill-green { fill: var(--ok); fill-opacity: .22; stroke: var(--ok); stroke-width: 2; }
.fig .fill-red { fill: var(--load); fill-opacity: .22; stroke: var(--load); stroke-width: 2; }
.fig .fill-hl { fill: var(--hl); fill-opacity: .3; stroke: var(--hl); stroke-width: 2; }
.fig .grid { stroke: var(--line); stroke-width: .8; }
.fig .axis { stroke: var(--fg); stroke-width: 1.2; }
.fig .curve { fill: none; stroke: var(--accent-2); stroke-width: 2; }
.fig .curve.muted { stroke: var(--muted); stroke-width: 1.2; opacity: .7; }
.fig .curve.hot { stroke: var(--load); stroke-width: 2.6; }
.fig .marker { fill: var(--hl); stroke: var(--fg); stroke-width: 1.5; }
.fig .guide { stroke: var(--load); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }

/* highlight / animation */
.fig.focus [data-k] { transition: opacity .4s ease; }
.fig.focus [data-k]:not(.hl) { opacity: .4; }
.fig [data-k].hl { opacity: 1; }
.fig .a-draw { stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: draw 1.1s ease-out forwards; }
.fig .a-fade { animation: fadein .7s ease both; }
.fig .a-pop { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.2,.9,.3,1.3) both; }
.fig .a-down { transform-box: fill-box; transform-origin: top center; animation: growdown .8s ease-out both; }
.fig .a-left { transform-box: fill-box; transform-origin: right center; animation: growleft .8s ease-out both; }
.fig .a-right { transform-box: fill-box; transform-origin: left center; animation: growleft .8s ease-out both; }
.fig .a-sink { animation: sink 1.6s ease-in-out both; }
.fig .a-pulse { animation: pulse 1.4s ease-in-out infinite; }
.fig .a-flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes growdown { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes growleft { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes sink { from { transform: translateY(0); } to { transform: translateY(var(--sink, 14px)); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes flow { to { stroke-dashoffset: -24; } }
@media (prefers-reduced-motion: reduce) {
  .fig .a-draw, .fig .a-fade, .fig .a-pop, .fig .a-down, .fig .a-left, .fig .a-right, .fig .a-sink, .fig .a-pulse, .fig .a-flow { animation: none; stroke-dashoffset: 0; }
  .step { animation: none !important; }
}
.fig-cap { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* data sliders */
.sliders { display: grid; gap: 8px; }
.sl { display: grid; grid-template-columns: 1fr 86px; grid-template-rows: auto auto; gap: 0 10px; align-items: center; }
.sl label { font-size: 13.5px; color: var(--muted); grid-column: 1; }
.sl .v { grid-column: 2; grid-row: 1 / span 2; font-family: var(--font-math); font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
.sl .v small { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-left: 3px; }
.sl input[type=range] { grid-column: 1; width: 100%; accent-color: var(--accent); margin: 0; }
.sl.changed label { color: var(--accent); font-weight: 600; }
.sliders-foot { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }

/* steps */
.steps-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.steps-head .prog { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
.steps { display: grid; gap: 10px; }
.step { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 12px 16px; background: var(--panel); animation: stepin .45s ease both; }
.step.cur { border-left-color: var(--accent); background: var(--step-bg); box-shadow: var(--shadow); }
.step.done { opacity: .82; }
.step .st { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
.step .st .no { font-family: var(--font-head); font-weight: 700; color: var(--accent); font-size: 14px; letter-spacing: .04em; }
.step .st h4 { font-size: 17px; }
.step .body p { margin: 6px 0; }
.step .note { font-size: 13.5px; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 6px; }
@keyframes stepin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.result { margin-top: 14px; border: 2px solid var(--ok); border-radius: var(--radius); padding: 12px 16px; background: var(--panel); animation: stepin .5s ease both; }
.result h3 { color: var(--ok); }
.result .big { font-family: var(--font-math); font-size: 22px; }
.hint { display: none; }

/* math markup */
.m { font-family: var(--font-math); font-size: 1.08em; white-space: normal; overflow-wrap: anywhere; }
.m .fr, .m .sq, .m sub, .m sup { white-space: nowrap; }
.m i { font-style: italic; }
.m sub, .m sup { font-size: .72em; line-height: 0; }
.m sub { vertical-align: -.25em; } .m sup { vertical-align: .55em; }
.m .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .15em; line-height: 1.15; }
.m .fr > span:first-child { border-bottom: 1.2px solid currentColor; padding: 0 .25em .05em; }
.m .fr > span:last-child { padding: .05em .25em 0; }
.m .sq { display: inline-flex; align-items: stretch; vertical-align: middle; }
.m .sq .sqi { border-top: 1.2px solid currentColor; padding: 0 .2em; margin-left: .05em; }
.m .txt { font-family: var(--font-ui); font-size: .9em; }
.m .u { font-style: normal; font-size: .9em; margin-left: .2em; }
.m .hl { background: var(--hl); color: #1f2328; padding: 0 .3em; border-radius: 4px; font-weight: 600; }
.m .op { padding: 0 .18em; }
.m .big { font-size: 1.35em; vertical-align: -.1em; }
.eq { font-family: var(--font-math); font-size: 1.14em; margin: 8px 0 8px 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.eq { overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
.eq .m { white-space: nowrap; }
.eq .why { font-family: var(--font-ui); font-size: 13px; color: var(--muted); }
.eqs { display: grid; gap: 4px; }

/* tables */
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 5px 9px; text-align: center; }
.tbl th { background: var(--panel-2); font-weight: 600; }
.tbl td:first-child, .tbl th:first-child { text-align: left; }
.tbl tr.hot td { background: var(--step-bg); font-weight: 600; }
.tbl .m { font-size: 1em; }
.tbl-wrap { overflow-x: auto; }

/* formula sheet */
.sheet { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.sheet .card h3 { color: var(--accent); font-size: 15px; letter-spacing: 0; text-transform: none; font-family: var(--font-head); }
.sheet .card .eq { margin-left: 4px; }
.sheet .card p { margin: 4px 0; font-size: 14px; }
.sheet .card .who { font-size: 12.5px; color: var(--muted); }
.wide, .sheet .card:has(table) { grid-column: 1 / -1; }
.sheet .card:has(table) .tbl { width: auto; min-width: 50%; }

/* presentation mode */
body.present .side { display: none; }
body.present .app { grid-template-columns: 1fr; }
body.present .main { font-size: 18px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
body.present .ex-head h2 { font-size: 36px; }
body.present .step .st h4 { font-size: 21px; }
body.present .eq { font-size: 1.25em; }
body.present .menu-btn { display: inline-flex; }

@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 20; left: 0; top: env(safe-area-inset-top, 0px); width: min(320px, 86vw); transform: translateX(-105%); transition: transform .3s ease; box-shadow: var(--shadow); }
  .side.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .grid2 { grid-template-columns: 1fr; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sheet { grid-template-columns: 1fr; }
}
.kbd { font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel-2); }

</style>
<script>
/* ============================================================
   Engine for interactive foundation-engineering exercises
   (shared by the bearing-capacity, settlement and pile apps)
   ============================================================ */
'use strict';

/* ---------- numbers ---------- */
function fmt(x, d) {
  if (d === undefined) d = 2;
  if (x === undefined || x === null || isNaN(x)) return '–';
  if (!isFinite(x)) return '∞';
  var s = Number(x).toFixed(d);
  if (s === '-0' || /^-0\.0*$/.test(s)) s = s.slice(1);
  return s;
}
function sig(x, n) { // significant-ish: adaptive decimals
  var a = Math.abs(x);
  if (a >= 1000) return fmt(x, 0);
  if (a >= 100) return fmt(x, 1);
  if (a >= 10) return fmt(x, 2);
  return fmt(x, n === undefined ? 3 : n);
}
var DEG = Math.PI / 180;
var tand = function (a) { return Math.tan(a * DEG); };
var sind = function (a) { return Math.sin(a * DEG); };
var cosd = function (a) { return Math.cos(a * DEG); };
function interp(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
  for (var i = 1; i < xs.length; i++) if (x <= xs[i]) {
    var t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
    return ys[i - 1] + t * (ys[i] - ys[i - 1]);
  }
  return ys[ys.length - 1];
}
/* bisection solve f(x)=0 on [a,b] */
function solve(f, a, b, tol) {
  tol = tol || 1e-6; var fa = f(a), fb = f(b);
  if (fa * fb > 0) { // try to expand
    for (var k = 0; k < 40 && fa * fb > 0; k++) { b += (b - a); fb = f(b); }
    if (fa * fb > 0) return NaN;
  }
  for (var i = 0; i < 80; i++) { var m = (a + b) / 2, fm = f(m); if (Math.abs(fm) < tol) return m; if (fa * fm < 0) { b = m; fb = fm; } else { a = m; fa = fm; } }
  return (a + b) / 2;

  function init(c) {

      var h = topbar('<span class="tags">' + (e.tags || []).map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</span>');
      h += '<div id="exroot"><div class="ex-head"><span class="kicker">' + cfg.kicker + ' · ' + (e.source || '') + '</span><h2>' + e.num + '. ' + e.title + '</h2></div>';
      h += '<div class="grid2"><div style="display:grid;gap:16px;min-width:0"><div class="card"><h3>Εκφώνηση</h3><div class="statement">' + e.statement + '</div></div>' +
        '<div class="card"><h3>Σχήμα</h3><div class="fig-wrap"><div class="fig" id="fig"></div><div class="fig-cap" id="figcap"></div></div></div></div>' +
        '<div style="display:grid;gap:16px;min-width:0"><div class="card"><h3>Δεδομένα – πειραματιστείτε</h3><div class="sliders" id="sliders"></div><div class="sliders-foot"><button class="btn" id="reset">↺ Τιμές εκφώνησης</button><span>Αλλάξτε τα δεδομένα και δείτε πώς αλλάζει κάθε βήμα της λύσης.</span></div></div>' +
        '<div class="card" id="quick"><h3>Βασικά μεγέθη</h3><div id="quickbody"></div></div></div></div>';
      h += '<div class="card"><div class="steps-head"><h3 style="margin:0">Λύση βήμα-βήμα</h3><span class="sp" style="flex:1"></span><span class="prog" id="prog"></span>' +
        '<button class="btn" id="prev">← Πίσω</button><button class="btn primary" id="next">Επόμενο βήμα →</button><button class="btn" id="play">▶ Αυτόματα</button><button class="btn" id="all">Όλα</button></div>' +
        '<div class="progress"><i id="pbar"></i></div><div class="steps" id="steps"></div><div id="resbox"></div></div>';
      h += '</div>';
      main.innerHTML = h;
      wireTop();
      renderSliders(e);
      $('#reset').onclick = function () { state.params[e.id] = {}; renderSliders(e); renderMain(false); };
      $('#prev').onclick = prev; $('#next').onclick = next;
      $('#play').onclick = function () { if (state.playing) stopPlay(); else { if (state.step >= e.steps.length) state.step = 0; state.playing = setInterval(function () { if (state.step >= e.steps.length) stopPlay(); else next(); }, cfg.playInterval || 4500); $('#play').textContent = '⏸ Παύση'; next(); } };
      $('#all').onclick = function () { stopPlay(); if (state.showAll) { state.showAll = false; state.step = 0; } else { state.showAll = true; state.step = e.steps.length; } renderMain(false); };
    }
    // figure
    var stepObj = state.step > 0 ? e.steps[state.step - 1] : null;
    var figHtml = e.figure(pr, r, state.step - 1);
    var fig = $('#fig'); fig.innerHTML = figHtml;
    var hl = stepObj && stepObj.hl;
    fig.classList.toggle('focus', !!(hl && hl.length));
    if (hl && hl.length) fig.querySelectorAll('[data-k]').forEach(function (n) { var on = hl.indexOf(n.getAttribute('data-k')) >= 0; n.classList.toggle('hl', on); if (on) n.classList.add('a-pop'); });
    $('#figcap').innerHTML = stepObj && stepObj.cap ? stepObj.cap : (e.figcap || '');
    // quick values
    $('#quickbody').innerHTML = e.quick ? e.quick(pr, r) : ''; $('#quick').hidden = !e.quick;
    $('#all').textContent = state.showAll ? 'Απόκρυψη' : 'Όλα';
    // steps
    var sh = '';
    for (var i = 0; i < Math.min(state.step, e.steps.length); i++) {
      var st = e.steps[i];
      sh += '<div class="step ' + (i === state.step - 1 ? 'cur' : 'done') + '"><div class="st"><span class="no">ΒΗΜΑ ' + (i + 1) + '</span><h4>' + st.title + '</h4></div><div class="body">' + st.body(pr, r) + '</div></div>';
    }
    $('#steps').innerHTML = sh;
    $('#resbox').innerHTML = state.step >= e.steps.length && e.result ? '<div class="result"><h3>Αποτέλεσμα</h3>' + e.result(pr, r) + '</div>' : '';
    $('#prog').textContent = 'Βήμα ' + state.step + ' / ' + e.steps.length;
    $('#pbar').style.width = (100 * state.step / e.steps.length) + '%';
    $('#prev').disabled = state.step === 0; $('#next').disabled = state.step >= e.steps.length;
    var cur = $('.step.cur'); if (cur && scroll && !state.showAll) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function renderSliders(e) {
    var pr = params(e), df = defaults(e), s = '';
    (e.givens || []).forEach(function (g) {
      var changed = Math.abs(pr[g.key] - df[g.key]) > 1e-9;
      s += '<div class="sl' + (changed ? ' changed' : '') + '"><label for="sl_' + g.key + '">' + g.label + '</label><span class="v">' + fmt(pr[g.key], g.dec === undefined ? (g.step < 1 ? 2 : 0) : g.dec) + '<small>' + (g.unit || '') + '</small></span><input type="range" id="sl_' + g.key + '" data-key="' + g.key + '" min="' + g.min + '" max="' + g.max + '" step="' + g.step + '" value="' + pr[g.key] + '"></div>';
    });
    $('#sliders').innerHTML = s || '<span style="color:var(--muted);font-size:13px">Η άσκηση δεν έχει μεταβλητά δεδομένα.</span>';
    $('#sliders').querySelectorAll('input').forEach(function (inp) {
      inp.addEventListener('input', function () {
        state.params[e.id] = state.params[e.id] || {}; state.params[e.id][inp.dataset.key] = parseFloat(inp.value);
        var g = e.givens.filter(function (x) { return x.key === inp.dataset.key; })[0];
        inp.parentNode.querySelector('.v').innerHTML = fmt(parseFloat(inp.value), g.dec === undefined ? (g.step < 1 ? 2 : 0) : g.dec) + '<small>' + (g.unit || '') + '</small>';
        inp.parentNode.classList.toggle('changed', Math.abs(parseFloat(inp.value) - g.value) > 1e-9);
        renderMain(false);
      });
    });
  }
  function next() { var e = ex(); if (!e || state.step >= e.steps.length) { stopPlay(); return; } state.step++; renderMain(false, true); }
  function prev() { var e = ex(); if (!e || state.step <= 0) return; state.step--; renderMain(false, true); }
  function stopPlay() { if (state.playing) { clearInterval(state.playing); state.playing = null; var b = $('#play'); if (b) b.textContent = '▶ Αυτόματα'; } }
  function renderSheet() {
    var main = $('#main');
    var h = topbar() + '<div class="ex-head"><span class="kicker">' + cfg.kicker + '</span><h2>Τυπολόγιο, πίνακες και διαγράμματα</h2></div><div class="sheet">';
    cfg.sheet.forEach(function (c) { h += '<div class="card' + (c.wide ? ' wide' : '') + '"><h3>' + c.title + '</h3>' + c.html + '</div>'; });
    main.innerHTML = h + '</div>';
    wireTop();
  }
  return { init: init, go: go, state: state };
})();

</script>
<script>
/* Φέρουσα Ικανότητα – ασκήσεις 1..8 (από: Υποδειγματικές Ασκήσεις Φέρουσας Ικανότητας, Π. Πελέκης, Νοέμβριος 2024) */
'use strict';
var EX = [];

/* ===================== ΑΣΚΗΣΗ 1 ===================== */
EX.push({
  id: 'b1', num: 1, group: 'Τοίχοι αντιστήριξης', source: 'Άσκηση 1',
  title: 'Μήκος πέλματος L ώστε να μην υπάρχει εκκεντρότητα στη βάση τοίχου',
  tags: ['Τοίχος ΩΣ', 'Ενεργητικές ωθήσεις', 'Εκκεντρότητα'],
  statement: p('Για τον τοίχο αντιστήριξης ΩΣ του σχήματος να υπολογίσετε τη διάσταση ' + m('L') + ' ώστε να μην εμφανίζεται εκκεντρότητα στη βάση του τοίχου. Ο τοίχος να θεωρηθεί λείος.') +
    '<ul><li>Αμμοχάλικο: ' + m('φ = 34.5°,\\; γ = 17\\unit{kN/m³}') + '</li><li>Σκυρόδεμα: ' + m('γ_c = 24\\unit{kN/m³}') + '</li><li>Κορμός 0.5 m, πέλμα πάχους 0.5 m, προεξοχή εμπρός 1.0 m, ύψος ' + m('H = 5.5\\unit{m}') + '</li></ul>' +
    p('<b>Διαδικασία:</b> κατακόρυφες δυνάμεις → ροπές ως προς το σημείο Α (άκρο πέλματος) → απαίτηση ' + m('\\frac{\\sum M_A}{\\sum V} = \\frac{B}{2}') + ' (ισοδύναμα ' + m('\\sum M_O = 0') + ' ως προς το μέσο της βάσης).'),
  givens: [
    { key: 'H', label: 'Ύψος τοίχου H', unit: 'm', value: 5.5, min: 3, max: 8, step: 0.1 },
    { key: 'phi', label: 'Γωνία τριβής φ', unit: '°', value: 34.5, min: 25, max: 42, step: 0.5, dec: 1 },
    { key: 'g', label: 'Ειδικό βάρος εδάφους γ', unit: 'kN/m³', value: 17, min: 15, max: 21, step: 0.5, dec: 1 },
    { key: 'gc', label: 'Ειδικό βάρος σκυροδέματος γc', unit: 'kN/m³', value: 24, min: 22, max: 25, step: 0.5, dec: 1 },
    { key: 'a', label: 'Προεξοχή εμπρός (πόδι)', unit: 'm', value: 1.0, min: 0.3, max: 2, step: 0.1 }
  ],
  compute: function (q) {
    var t = 0.5, tb = 0.5, H = q.H, hs = H - tb;
    var W1 = hs * q.gc * t, arm1 = q.a + t / 2;
    var Ka = GEO.Ka(q.phi), sa = Ka * q.g * H, Pa = 0.5 * sa * H, armPa = H / 3;
    function parts(L) {
      var B = q.a + t + L, W2 = B * q.gc * tb, W3 = hs * q.g * L;
      var SV = W1 + W2 + W3, SM = W1 * arm1 + W2 * B / 2 + W3 * (q.a + t + L / 2) - Pa * armPa;
      return { B: B, W2: W2, W3: W3, SV: SV, SM: SM, e: B / 2 - SM / SV };
    }
    var L = solve(function (L) { var k = parts(L); return k.SM - k.SV * k.B / 2; }, 0.2, 12);
    var k = parts(L);
    return { t: t, tb: tb, hs: hs, W1: W1, arm1: arm1, Ka: Ka, sa: sa, Pa: Pa, armPa: armPa, L: L, B: k.B, W2: k.W2, W3: k.W3, SV: k.SV, SM: k.SM, parts: parts,
      c2: q.gc * tb, c3: hs * q.g }; // W2 = c2·B, W3 = c3·L
  },
  figure: function (q, r, step) {
    var s = 46, x0 = 150, gy = 380, H = q.H, L = isNaN(r.L) ? 2 : Math.min(r.L, 5);
    var a = q.a, t = r.t, tb = r.tb, B = a + t + L;
    var yTop = gy - H * s, yBase = gy - tb * s;
    var xs = x0 + a * s, xh = xs + t * s, xe = xh + L * s;
    var W = 760, Hc = 440;
    var h = SVG.open(W, Hc, 'aria-label="Τοίχος αντιστήριξης με επίχωση, κατακόρυφες δυνάμεις W1 W2 W3 και ενεργητική ώθηση Pa"');
    h += SVG.soil(xh, yTop, 720 - xh, gy - yTop, 'sand');          // backfill
    h += SVG.rect(30, gy, 700, Hc - gy - 10, 'soil2');              // foundation soil
    h += SVG.ground(30, xs, gy, 'left') + SVG.ground(xh, 730, yTop, 'right');
    // wall
    h += SVG.poly([[x0, yBase], [x0 + B * s, yBase], [x0 + B * s, gy], [x0, gy]], 'conc', 'data-k="B"');
    h += SVG.rect(xs, yTop, t * s, H * s - tb * s, 'conc');
    // weights
    var cx1 = xs + t * s / 2, cy1 = (yTop + yBase) / 2;
    h += '<g data-k="W1">' + SVG.arrow(cx1, cy1 - 40, cx1, cy1 + 40, 'weight') + SVG.label(cx1 + 14, cy1 + 5, tsub('W', '1'), 'math', 'start') + '</g>';
    var cx2 = x0 + B * s / 2, cy2 = yBase + tb * s / 2;
    h += '<g data-k="W2">' + SVG.arrow(cx2, cy2 - 6, cx2, cy2 + 50, 'weight') + SVG.label(cx2 + 12, cy2 + 40, tsub('W', '2'), 'math', 'start') + '</g>';
    var cx3 = xh + L * s / 2, cy3 = (yTop + yBase) / 2;
    h += '<g data-k="W3">' + SVG.arrow(cx3, cy3 - 40, cx3, cy3 + 40, 'weight') + SVG.label(cx3 + 14, cy3 + 5, tsub('W', '3'), 'math', 'start') + '</g>';
    // active pressure on vertical plane through heel end
    var wB = Math.min(110, r.sa * 3);
    h += '<g data-k="Pa">' + SVG.pressure(xe, yTop, gy, 0, wB, 1, 'load-fill', '', 6) +
      SVG.arrow(xe + wB + 30, gy - r.armPa * s, xe + 4, gy - r.armPa * s, 'load') + SVG.label(xe + wB + 36, gy - r.armPa * s - 8, tsub('P', 'a'), 'lbl-load math', 'start') +
      SVG.label(xe + wB + 6, gy - 4, 'σ' + '<tspan dy="4" font-size="10">a</tspan>', 'lbl-load math', 'start') + '</g>';
    // points
    h += '<g data-k="A">' + SVG.point(x0, gy, 'A', -16, 18) + '</g>';
    h += SVG.point(x0 + B * s / 2, gy, 'O', 6, 18);
    // dims
    h += '<g data-k="L">' + SVG.dim(xh, yBase - 8, xe, yBase - 8, 'L = ' + fmt(r.L, 2) + ' m', -18) + '</g>';
    h += SVG.dim(x0, yBase - 8, xs, yBase - 8, fmt(a, 1) + ' m', -18);
    h += SVG.dim(x0 - 50, yTop, x0 - 50, gy, 'H = ' + fmt(H, 1) + ' m', -8);
    h += '<g data-k="B">' + SVG.dim(x0, gy + 12, x0 + B * s, gy + 12, 'B = ' + fmt(r.B, 2) + ' m', 18) + '</g>';
    h += SVG.dim(x0 + B * s + 10, yBase, x0 + B * s + 10, gy, fmt(tb, 1), 8);
    h += SVG.label(xh + 90, yTop + 26, 'Αμμοχάλικο φ=' + fmt(q.phi, 1) + '°, γ=' + fmt(q.g, 0) + ' kN/m³', 'lbl-muted', 'start');
    h += SVG.label(xs + t * s / 2, yTop - 8, '0.5', 'lbl-muted');
    // resultant at step 5
    if (step >= 4) { h += '<g class="a-fade">' + SVG.arrow(x0 + B * s / 2, gy - 110, x0 + B * s / 2, gy - 8, 'fg', '', 4) + SVG.label(x0 + B * s / 2 + 10, gy - 90, 'ΣV στο μέσο → e = 0', 'math', 'start') + '</g>'; }
    return h + SVG.close();
  },
  figcap: 'Λείος τοίχος: η ενεργητική ώθηση λαμβάνεται στο κατακόρυφο επίπεδο που περνά από το άκρο του πέλματος, το έδαφος πάνω από το πέλμα (W₃) λογίζεται ως βάρος.',
  quick: function (q, r) {
    return '<dl class="given"><dt>' + m('K_a') + '</dt><dd>' + fmt(r.Ka, 3) + '</dd><dt>' + m('σ_a') + ' (βάση)</dt><dd>' + fmt(r.sa, 1) + ' kPa</dd><dt>' + m('P_a') + '</dt><dd>' + fmt(r.Pa, 1) + ' kN/m</dd><dt>' + m('\\sum V') + '</dt><dd>' + fmt(r.SV, 1) + ' kN/m</dd><dt>' + m('L') + '</dt><dd><b>' + fmt(r.L, 2) + ' m</b></dd></dl>';
  },
  steps: [
    {
      title: 'Κατακόρυφες δυνάμεις (ανά τρέχον μέτρο)', hl: ['W1', 'W2', 'W3'],
      cap: 'Τρία βάρη: κορμός W₁, πέλμα W₂, επίχωση πάνω από το πέλμα W₃. Τα W₂, W₃ εξαρτώνται από το άγνωστο L.',
      body: function (q, r) {
        return eqs([
          ['W_1 = (H - 0.5)\\,γ_c\\,0.5 = (' + fmt(q.H, 1) + '-0.5)\\times' + fmt(q.gc, 0) + '\\times 0.5 = \\hl{' + fmt(r.W1, 1) + '\\unit{kN}}', 'κορμός'],
          ['W_2 = (' + fmt(q.a + 0.5, 1) + '+L)\\,γ_c\\,0.5 = ' + fmt(r.c2, 0) + 'L + ' + fmt(r.c2 * (q.a + 0.5), 1), 'πέλμα'],
          ['W_3 = (H-0.5)\\,γ\\,L = ' + fmt(r.c3, 1) + '\\,L', 'επίχωση πάνω από το πέλμα']
        ]);
      }
    },
    {
      title: 'Συντελεστής ενεργητικών ωθήσεων', hl: ['Pa'],
      body: function (q, r) { return eq('K_a = \\tan^2\\left(45° - \\frac{φ}{2}\\right) = \\tan^2(' + fmt(45 - q.phi / 2, 2) + '°) = \\hl{' + fmt(r.Ka, 3) + '}', 'Rankine, λείος τοίχος, οριζόντια επιφάνεια'); }
    },
    {
      title: 'Ενεργητική τάση και ώθηση', hl: ['Pa'],
      cap: 'Τριγωνική κατανομή: μηδέν στην επιφάνεια, μέγιστη στη βάση. Η συνισταμένη Pa στο H/3 από τη βάση.',
      body: function (q, r) {
        return eqs([
          ['σ_a = K_a\\,γ\\,H = ' + fmt(r.Ka, 3) + '\\times' + fmt(q.g, 0) + '\\times' + fmt(q.H, 1) + ' = \\hl{' + fmt(r.sa, 1) + '\\unit{kPa}}'],
          ['P_a = \\frac{1}{2}\\,σ_a\\,H = \\frac{1}{2}\\times' + fmt(r.sa, 1) + '\\times' + fmt(q.H, 1) + ' = \\hl{' + fmt(r.Pa, 1) + '\\unit{kN/m}}', 'στο ύψος H/3 = ' + fmt(r.armPa, 2) + ' m']
        ]);
      }
    },
    {
      title: 'Ροπές ως προς το σημείο Α', hl: ['A', 'W1', 'W2', 'W3', 'Pa'],
      cap: 'Οι μοχλοβραχίονες μετρώνται από το μπροστινό άκρο Α. Τα βάρη δίνουν ροπές ευστάθειας (+), η Pa ροπή ανατροπής (−).',
      body: function (q, r) {
        var a = q.a, c2 = r.c2, c3 = r.c3, a05 = a + 0.5;
        return table(['Δύναμη', 'Τιμή (kN)', 'Μοχλοβραχίονας (m)', 'Ροπή ως προς Α (kNm)'], [
          [m('W_1'), fmt(r.W1, 1), fmt(r.arm1, 2), '+' + fmt(r.W1 * r.arm1, 1)],
          [m('W_2'), m(fmt(c2, 0) + 'L+' + fmt(c2 * a05, 1)), m('\\frac{' + fmt(a05, 1) + '+L}{2}'), m('+(' + fmt(c2 / 2, 0) + 'L^2 + ' + fmt(c2 * a05, 1) + 'L + ' + fmt(c2 * a05 * a05 / 2, 2) + ')')],
          [m('W_3'), m(fmt(c3, 1) + 'L'), m(fmt(a05, 1) + '+\\frac{L}{2}'), m('+(' + fmt(c3 / 2, 2) + 'L^2 + ' + fmt(c3 * a05, 1) + 'L)')],
          [m('P_a'), fmt(r.Pa, 1), fmt(r.armPa, 2), '−' + fmt(r.Pa * r.armPa, 1)]
        ]) + eqs([
          ['\\sum V = ' + fmt(c2 + c3, 1) + 'L + ' + fmt(r.W1 + c2 * a05, 1)],
          ['\\sum M_A = ' + fmt(c2 / 2 + c3 / 2, 2) + 'L^2 + ' + fmt(c2 * a05 + c3 * a05, 1) + 'L + ' + fmt(r.W1 * r.arm1 + c2 * a05 * a05 / 2 - r.Pa * r.armPa, 1)]
        ]);
      }
    },
    {
      title: 'Συνθήκη μηδενικής εκκεντρότητας → L', hl: ['L', 'B'],
      cap: 'Η συνισταμένη των κατακόρυφων δυνάμεων πρέπει να περνά από το μέσο της βάσης: e = 0.',
      body: function (q, r) {
        return p('Η συνισταμένη περνά από το μέσο της βάσης όταν η απόσταση της από το Α ισούται με B/2:') +
          eqs([
            ['\\frac{\\sum M_A}{\\sum V} = \\frac{B}{2} = \\frac{' + fmt(q.a + 0.5, 1) + ' + L}{2}'],
            ['\\Rightarrow\\; (' + fmt(q.a + 0.5, 1) + '+L)\\,\\sum V = 2\\,\\sum M_A', 'οι όροι L² απαλείφονται, γραμμική εξίσωση'],
            ['\\Rightarrow\\; L = \\hl{' + fmt(r.L, 2) + '\\unit{m}} \\approx ' + fmt(Math.round(r.L * 2) / 2, 1) + '\\unit{m},\\quad B = ' + fmt(r.B, 2) + '\\unit{m}']
          ]) + note('Έλεγχος: ' + m('\\sum M_A/\\sum V = ' + fmt(r.SM / r.SV, 2) + '\\unit{m} = B/2'));
      }
    }
  ],
  result: function (q, r) { return '<div class="big">' + m('L \\approx ' + fmt(r.L, 2) + '\\unit{m}') + '</div><p>Με ' + m('L = ' + fmt(r.L, 2) + '\\unit{m}') + ' η συνισταμένη των φορτίων περνά από το μέσο της βάσης (πλάτος ' + m('B = ' + fmt(r.B, 2) + '\\unit{m}') + '), άρα η τάση εδάφους είναι ομοιόμορφη.</p>'; }
});

/* ---------- local helpers ---------- */
/* section of a footing in a trench: o = {B, Df, Vlabel, wt, step, wedgeStep, labelsAbove, labelsBelow, Hlabel, extra, Bname} */
function footingSection(o) {
  var W = 760, Hc = 400, gy = 120, cx = 400;
  var B = Math.max(o.B, 0.6), Df = Math.max(o.Df, 0);
  var s = Math.min(240 / B, 90 / Math.max(Df, 0.8), 75);
  var yf = gy + Df * s, ft = 22, xl = cx - B * s / 2, xr = cx + B * s / 2, trench = 34;
  var h = SVG.open(W, Hc, 'aria-label="Τομή θεμελίου σε βάθος θεμελίωσης με έδαφος, φορτίο και υδροφόρο ορίζοντα"');
  h += SVG.soil(40, gy, xl - trench - 40, Hc - gy - 10, 'sand') + SVG.soil(xr + trench, gy, 720 - xr - trench, Hc - gy - 10, 'sand');
  h += SVG.soil(xl - trench, yf, xr - xl + 2 * trench, Hc - yf - 10, o.lowerType || 'sand');
  h += SVG.ground(40, xl - trench, gy, 'left') + SVG.ground(xr + trench, 720, gy, 'right');
  h += SVG.line(xl - trench, gy, xl - trench, yf, 'ground') + SVG.line(xr + trench, gy, xr + trench, yf, 'ground') + SVG.line(xl - trench, yf, xr + trench, yf, 'ground');
  // failure mechanism
  if (o.wedgeStep !== undefined && o.step >= o.wedgeStep) {

      body: function (q, r) { return eqs([['q_{app} = \\frac{P}{B\\,L} = \\frac{' + fmt(q.P, 0) + '}{' + fmt(r.B, 1) + '\\times' + fmt(r.L, 1) + '} = ' + fmt(r.qapp, 1) + '\\unit{kPa}'], ['q_{app,net} = q_{app} - γ_κ\\,D_f = ' + fmt(r.qapp, 1) + ' - ' + fmt(r.p0, 0) + ' = \\hl{' + fmt(r.qappnet, 1) + '\\unit{kPa}}']]); }
    },
    {
      title: 'TSA – ανάλυση ολικών τάσεων (αστράγγιστες συνθήκες)', hl: ['wedge', 'TSA'],
      cap: 'φ = 0: μόνο ο όρος συνοχής (cu·Nc·Sc) και το υπερκείμενο. Nγ = 0, Nq = 1.',
      body: function (q, r) {
        var t = r.t;
        return eqs([
          ['c_u = ' + fmt(q.cu, 0) + '\\unit{kPa},\\; φ = 0 \\;\\Rightarrow\\; N_c = 5.14,\\; N_q = 1,\\; N_γ = 0'],
          ['S_c = 1 + 0.2\\,\\frac{B}{L} = ' + fmt(t.Sc, 2) + ',\\quad S_q = 1,\\quad S_γ = 1 - 0.4\\,\\frac{B}{L} = ' + fmt(t.Sg, 2)],
          ['q_{ult} = c_u N_c S_c + γ_κ D_f N_q S_q + 0 = ' + fmt(q.cu, 0) + '\\times 5.14\\times' + fmt(t.Sc, 2) + ' + ' + fmt(r.p0, 0) + ' = \\hl{' + fmt(t.qult, 0) + '\\unit{kPa}}'],
          ['q_{ult,net} = ' + fmt(t.qult, 0) + ' - ' + fmt(r.p0, 0) + ' = ' + fmt(t.net, 0) + '\\unit{kPa} \\;\\Rightarrow\\; FS_{TSA} = \\frac{' + fmt(t.net, 0) + '}{' + fmt(r.qappnet, 0) + '} = \\hl{' + fmt(t.FS, 2) + '}']
        ]) + note('Στις αστράγγιστες συνθήκες χρησιμοποιούνται ολικές τάσεις: το υπερκείμενο είναι γκ·Df (όχι γ′), γιατί η πίεση πόρων δεν αφαιρείται.');
      }
    },
    {
      title: 'ESA – συντελεστές (στραγγιζόμενες συνθήκες)', hl: ['wedge', 'WT'],
      body: function (q, r) {
        var e = r.e;
        return eqs([
          ['c\' = 0,\\; φ\' = ' + fmt(q.phi, 0) + '° \\;\\Rightarrow\\; N_c = ' + fmt(e.Nc, 1) + ',\\; N_q = \\hl{' + fmt(e.Nq, 1) + '},\\; N_γ = \\hl{' + fmt(e.Ng, 1) + '}'],
          ['S_c = 1 + \\frac{N_q}{N_c}\\frac{B}{L} = ' + fmt(e.Sc, 2) + ',\\quad S_q = 1 + \\frac{B}{L}\\tan φ\' = \\hl{' + fmt(e.Sq, 2) + '},\\quad S_γ = 1 - 0.4\\frac{B}{L} = \\hl{' + fmt(e.Sg, 2) + '}']
        ]) + TABLES.bc(q.phi);
      }
    },
    {
      title: 'ESA – φέρουσα ικανότητα και FS', hl: ['ESA', 'wedge'],
      body: function (q, r) {
        var e = r.e;
        return eqs([
          ['q_{ult} = γ_κ D_f N_q S_q + \\frac{1}{2}γ\'\\,B\\,N_γ S_γ = ' + fmt(r.p0, 0) + '\\times' + fmt(e.Nq, 1) + '\\times' + fmt(e.Sq, 2) + ' + 0.5\\times' + fmt(r.gsub, 0) + '\\times' + fmt(r.B, 1) + '\\times' + fmt(e.Ng, 1) + '\\times' + fmt(e.Sg, 2)],
          ['= ' + fmt(e.q1, 0) + ' + ' + fmt(e.q2, 0) + ' = \\hl{' + fmt(e.qult, 0) + '\\unit{kPa}},\\quad q_{ult,net} = ' + fmt(e.net, 0) + '\\unit{kPa}'],
          ['FS_{ESA} = \\frac{' + fmt(e.net, 0) + '}{' + fmt(r.qappnet, 0) + '} = \\hl{' + fmt(e.FS, 2) + '}']
        ]);
      }
    },
    {
      title: 'Σύγκριση: κρίσιμη ανάλυση', hl: ['TSA', 'ESA'],
      body: function (q, r) {
        return table(['Ανάλυση', 'Παράμετροι αντοχής', m('q_{ult}') + ' (kPa)', m('q_{ult,net}') + ' (kPa)', 'FS'], [
          ['TSA (βραχυπρόθεσμα)', 'cu = ' + fmt(q.cu, 0) + ' kPa, φ = 0', fmt(r.t.qult, 0), fmt(r.t.net, 0), fmt(r.t.FS, 2)],
          ['ESA (μακροπρόθεσμα)', 'c′ = 0, φ′ = ' + fmt(q.phi, 0) + '°', fmt(r.e.qult, 0), fmt(r.e.net, 0), fmt(r.e.FS, 2)]
        ], r.governs === 'TSA' ? 0 : 1) + eq('FS_{min} = \\hl{' + fmt(r.FSmin, 2) + '}\\quad(' + r.governs + ')');
      }
    }
  ],
  result: function (q, r) { return '<div class="big">' + m('FS_{min} = ' + fmt(r.FSmin, 1) + '\\;(' + r.governs + ')') + '</div><p>' + (r.governs === 'TSA' ? 'Κρίσιμη είναι η αστράγγιστη (βραχυπρόθεσμη) κατάσταση αμέσως μετά τη φόρτιση. Με τη στερεοποίηση η αντοχή αυξάνει και ο FS μακροπρόθεσμα φτάνει ' + fmt(r.e.FS, 1) + '.' : 'Κρίσιμη είναι η στραγγιζόμενη (μακροπρόθεσμη) κατάσταση.') + '</p>'; }
});

/* ===================== ΤΥΠΟΛΟΓΙΟ ===================== */
var SHEET = [
  { title: 'Ωθήσεις γαιών (Rankine, λείος τοίχος, οριζόντια επιφάνεια)', html: eqs(['K_a = \\tan^2\\left(45° - \\frac{φ}{2}\\right),\\quad K_p = \\tan^2\\left(45° + \\frac{φ}{2}\\right)', 'σ_a = K_a\\,σ_v - 2c\\sqrt{K_a},\\quad σ_p = K_p\\,σ_v + 2c\\sqrt{K_p}', 'P_a = \\frac{1}{2}K_a γ H^2\\;\\text{(στο H/3 από τη βάση)}', 'P_q = K_a\\,q\\,H\\;\\text{(επιφόρτιση q, στο H/2)}', 'P_p = \\frac{σ_{pA}+σ_{pB}}{2}\\,h\\;\\text{(τραπεζοειδής κατανομή)}']) + '<p class="who">Σε λείο τοίχο η ώθηση λαμβάνεται στο κατακόρυφο επίπεδο στο άκρο του πέλματος και το έδαφος πάνω από το πέλμα λογίζεται ως βάρος.</p>' },
  { title: 'Ευστάθεια τοίχων: εκκεντρότητα, ανατροπή, ολίσθηση', html: eqs(['x̄ = \\frac{\\sum M_A}{\\sum V},\\quad e = x̄ - \\frac{B}{2},\\quad B\' = B - 2|e|', 'e = 0 \\;\\Leftrightarrow\\; \\frac{\\sum M_A}{\\sum V} = \\frac{B}{2}\\;\\Leftrightarrow\\;\\sum M_O = 0', 'FS_{ανατρ} = \\frac{\\sum M_{ευστ}}{\\sum M_{ανατρ}}\\;\\text{(ως προς το άκρο Α)}', 'FS_{ολ} = \\frac{c_u B\' + \\sum V\\tan δ + P_p}{\\sum H}', 'q_{max,min} = \\frac{V}{B\\,L}\\left(1 \\pm \\frac{6e}{B}\\right),\\quad e \\le \\frac{B}{6}\\;\\text{(χωρίς αδρανή περιοχή)}']) },
  { title: 'DIN 4017 – γενική εξίσωση', html: eqs(['q_{ult} = c\\,N_c\\,K_c\\,V_c + γ_2\\,B\'\\,N_b\\,K_b\\,V_b + γ_1\\,d\\,N_d\\,K_d\\,V_d']) + '<p>' + m('N_c, N_d, N_b') + ' συντελεστές φέρουσας ικανότητας (Πίνακας 1) · ' + m('V') + ' συντελεστές μορφής (Πίνακας 2) · ' + m('K') + ' μειωτικοί συντελεστές λοξής φόρτισης (Πίνακας 3) · ' + m('γ_1') + ' ειδικό βάρος πάνω από τη στάθμη έδρασης, ' + m('γ_2') + ' κάτω από αυτήν (βυθισμένο αν υπάρχει Υ.Ο.).</p>' + eqs(['e = \\frac{M}{V},\\quad B\' = B - 2e_B,\\quad L\' = L - 2e_L,\\quad A\' = B\'L\'', 'N_d = e^{π\\tan φ}\\tan^2(45°+φ/2),\\quad N_c = \\frac{N_d - 1}{\\tan φ},\\quad N_b = (N_d - 1)\\tan φ']) },
  { title: 'Συντελεστής ασφαλείας (καθαρές τάσεις)', html: eqs(['FS = \\frac{q_{ult,net}}{q_{app,net}} = \\frac{q_{ult} - γ_1 d}{\\frac{V}{A\'} - γ_1 d}']) + '<p>Η υπερκείμενη γεωστατική τάση ' + m('γ_1 d') + ' υπήρχε πριν την κατασκευή: αφαιρείται και από τις δύο τάσεις. Σε επαναληπτικές λύσεις (Kc με FS·H) ο υποτιθέμενος FS πρέπει να συμπέσει με τον υπολογιζόμενο.</p>' },
  { title: 'Γενική εξίσωση (Terzaghi–Meyerhof–Hansen)', html: eqs(['q_{ult} = c\\,N_c\\,S_c + σ\'_{z,D}\\,N_q\\,S_q + \\frac{1}{2}\\,γ\'\\,B\\,N_γ\\,S_γ', 'N_q = e^{π\\tan φ}\\tan^2\\left(45°+\\frac{φ}{2}\\right),\\quad N_c = (N_q - 1)\\cot φ\\;(= 5.14\\;\\text{για}\\;φ=0),\\quad N_γ = 1.5\\,(N_q - 1)\\tan φ\\;\\text{(Hansen)}', 'S_c = 1 + \\frac{N_q}{N_c}\\frac{B}{L}\\;\\left(= 1 + 0.2\\frac{B}{L}\\;\\text{για}\\;φ=0\\right),\\quad S_q = 1 + \\frac{B}{L}\\tan φ,\\quad S_γ = 1 - 0.4\\frac{B}{L}']) + '<p class="who">' + m('σ_{z,D}') + ': κατακόρυφη τάση στη στάθμη θεμελίωσης (ολική στην TSA, ενεργός στην ESA).</p>' },
  { title: 'Υδροφόρος ορίζοντας και TSA / ESA', html: eqs(['γ\' = γ_{sat} - γ_w,\\quad γ_w = 10\\unit{kN/m³}']) + '<p><b>Υ.Ο. στη στάθμη θεμελίωσης:</b> υπερκείμενο με ολικό γ (πάνω από τον Υ.Ο.), όρος πλάτους με γ′.</p><p><b>TSA</b> (ολικές τάσεις, βραχυπρόθεσμα): ' + m('c = c_u,\\; φ = 0 \\Rightarrow N_c = 5.14, N_q = 1, N_γ = 0') + ', υπερκείμενο ' + m('γ_{sat} D_f') + '.</p><p><b>ESA</b> (ενεργές τάσεις, μακροπρόθεσμα): ' + m('c\', φ\'') + ', ενεργές γεωστατικές τάσεις. Κρίσιμος ο μικρότερος FS, σε κορεσμένες αργίλους συνήθως η TSA.</p>' },
  { title: 'Πίνακας 1 · Συντελεστές φέρουσας ικανότητας κατά DIN 4017', html: TABLES.din1(), wide: false },
  { title: 'Πίνακας 2 · Συντελεστές μορφής κατά DIN 4017', html: TABLES.din2() },
  { title: 'Πίνακας 3 · Μειωτικοί συντελεστές λοξής φόρτισης (DIN 4017)', html: TABLES.din3() + '<p class="who">H, V: οριζόντια και κατακόρυφη συνιστώσα του φορτίου σχεδιασμού (H<sub>b</sub> = FS·H, V<sub>b</sub> = FS·V). Για c = 0 οι συντελεστές ασφαλείας απλοποιούνται.</p>' },
  { title: 'Συντελεστές Nc, Nq, Nγ (Hansen) για τη γενική εξίσωση', html: TABLES.bc() }
];

APP.init({ appName: 'Διαδραστικές Ασκήσεις · Φέρουσα Ικανότητα', version: 'v1.0', desc: 'Υποδειγματικές ασκήσεις φέρουσας ικανότητας επιφανειακών θεμελιώσεων και τοίχων αντιστήριξης', uni: 'Πανεπιστήμιο Πατρών · Τμήμα Πολιτικών Μηχανικών', title: 'Φέρουσα Ικανότητα', subtitle: 'Θεμελιώσεις · Υποδειγματικές ασκήσεις', kicker: 'Φέρουσα ικανότητα', footer: 'Βασισμένο στις Υποδειγματικές Ασκήσεις Φέρουσας Ικανότητας (Π. Πελέκης, 2024).', exercises: EX, sheet: SHEET });

</script>
